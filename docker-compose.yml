services:
  postgres:
    image: postgres:16-alpine
    container_name: halaalvest-postgres
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-55434}:5432"
    environment:
      POSTGRES_DB: amanah_cooperative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - halaalvest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amanah_cooperative"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halaalvest-postgres-data:
